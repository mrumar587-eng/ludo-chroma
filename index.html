<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ludo Chroma</title>
    <meta name="description" content="A clean, modern pass-and-play Ludo Chroma board game with Classic and Quick Match modes." />
    <meta property="og:title" content="Ludo Chroma" />
    <meta property="og:description" content="A clean, modern pass-and-play Ludo Chroma board game with Classic and Quick Match modes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F6F7FB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ludo Chroma" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      .ludo-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background-color: #F6F7FB;
        color: #1B1F2A;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .ludo-splash {
          background-color: #12141C;
          color: #F3F4F8;
        }
        .ludo-splash-art {
          filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.36));
        }
      }
      .ludo-splash-art {
        width: 120px;
        height: 120px;
        margin-bottom: 14px;
        filter: drop-shadow(0 10px 22px rgba(27, 31, 42, 0.08));
      }
      .ludo-splash-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .ludo-splash-sub {
        margin-top: 6px;
        font-size: 13px;
        font-weight: 500;
        opacity: 0.65;
        line-height: 1.3;
      }
      .ludo-splash-dots {
        margin-top: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .ludo-splash-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        animation: ludo-dot-bounce 1.2s ease-in-out infinite;
      }
      .ludo-splash-dot:nth-child(1) { background: #E53935; animation-delay: 0s; }
      .ludo-splash-dot:nth-child(2) { background: #43A047; animation-delay: 0.15s; }
      .ludo-splash-dot:nth-child(3) { background: #1E88E5; animation-delay: 0.3s; }
      .ludo-splash-dot:nth-child(4) { background: #FDC82A; animation-delay: 0.45s; }
      @keyframes ludo-dot-bounce {
        0%, 80%, 100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ludo-splash-dot {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ludo-splash" role="status" aria-label="Loading Ludo Chroma">
        <svg class="ludo-splash-art" viewBox="0 0 110 110" width="120" height="120" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="96" height="96" rx="22" fill="#FFFFFF" stroke="#E3E6F2" stroke-width="1.5" />
          <g transform="translate(2 2) scale(0.96)">
            <rect x="40" y="9" width="20" height="82" rx="7" fill="#EEF0F7" />
            <rect x="9" y="40" width="82" height="20" rx="7" fill="#EEF0F7" />
            <rect x="48.5" y="14" width="3" height="22" rx="1.5" fill="#BFDCC6" />
            <rect x="14" y="48.5" width="22" height="3" rx="1.5" fill="#ECC0C4" />
            <rect x="64" y="48.5" width="22" height="3" rx="1.5" fill="#F1E0B0" />
            <rect x="48.5" y="64" width="3" height="22" rx="1.5" fill="#B9D5F0" />
            <rect x="10" y="10" width="31" height="31" rx="9" fill="#E53935" />
            <rect x="59" y="10" width="31" height="31" rx="9" fill="#43A047" />
            <rect x="10" y="59" width="31" height="31" rx="9" fill="#1E88E5" />
            <rect x="59" y="59" width="31" height="31" rx="9" fill="#FDC82A" />
            <rect x="16" y="16" width="19" height="19" rx="5" fill="#FFFFFF" />
            <rect x="65" y="16" width="19" height="19" rx="5" fill="#FFFFFF" />
            <rect x="16" y="65" width="19" height="19" rx="5" fill="#FFFFFF" />
            <rect x="65" y="65" width="19" height="19" rx="5" fill="#FFFFFF" />
            <circle cx="25.5" cy="25.5" r="7" fill="#FFFFFF" />
            <circle cx="25.5" cy="25.5" r="5.4" fill="#E53935" />
            <ellipse cx="23.8" cy="23.4" rx="2.2" ry="1.3" fill="#FFFFFF" opacity=".55" />
            <circle cx="74.5" cy="25.5" r="7" fill="#FFFFFF" />
            <circle cx="74.5" cy="25.5" r="5.4" fill="#43A047" />
            <ellipse cx="72.8" cy="23.4" rx="2.2" ry="1.3" fill="#FFFFFF" opacity=".55" />
            <circle cx="25.5" cy="74.5" r="7" fill="#FFFFFF" />
            <circle cx="25.5" cy="74.5" r="5.4" fill="#1E88E5" />
            <ellipse cx="23.8" cy="72.4" rx="2.2" ry="1.3" fill="#FFFFFF" opacity=".55" />
            <circle cx="74.5" cy="74.5" r="7" fill="#FFFFFF" />
            <circle cx="74.5" cy="74.5" r="5.4" fill="#FDC82A" />
            <ellipse cx="72.8" cy="72.4" rx="2.2" ry="1.3" fill="#FFFFFF" opacity=".55" />
            <rect x="37.5" y="37.5" width="25" height="25" rx="2.5" fill="#FFFFFF" />
            <polygon points="50,50 39,39 61,39" fill="#43A047" />
            <polygon points="50,50 61,39 61,61" fill="#FDC82A" />
            <polygon points="50,50 61,61 39,61" fill="#1E88E5" />
            <polygon points="50,50 39,61 39,39" fill="#E53935" />
          </g>
          <circle cx="64" cy="62" r="7.5" fill="#FFFFFF" stroke="#E3E6F2" stroke-width="0.6" />
          <circle cx="64" cy="62" r="5.7" fill="#FDC82A" />
          <ellipse cx="62.2" cy="59.8" rx="2.3" ry="1.4" fill="#FFFFFF" opacity=".55" />
          <g transform="translate(86 88) rotate(10)">
            <rect x="-15" y="-15" width="30" height="30" rx="7.5" fill="#FFFFFF" stroke="#E3E6F2" stroke-width="1.5" />
            <circle cx="-6" cy="-6" r="2.4" fill="#1B1F2A" />
            <circle cx="6" cy="-6" r="2.4" fill="#1B1F2A" />
            <circle cx="0" cy="0" r="2.4" fill="#1B1F2A" />
            <circle cx="-6" cy="6" r="2.4" fill="#1B1F2A" />
            <circle cx="6" cy="6" r="2.4" fill="#1B1F2A" />
          </g>
        </svg>
        <div class="ludo-splash-title">Ludo Chroma</div>
        <div class="ludo-splash-sub">Roll. Race. Win.</div>
        <div class="ludo-splash-dots" aria-hidden="true">
          <span class="ludo-splash-dot"></span>
          <span class="ludo-splash-dot"></span>
          <span class="ludo-splash-dot"></span>
          <span class="ludo-splash-dot"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
